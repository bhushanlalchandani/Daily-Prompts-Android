name: Build Daily Prompts APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract selected source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="daily-prompts (2).zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in the repository root."
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PROJECT="extracted"
          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            PROJECT="$(find extracted -mindepth 1 -maxdepth 3 -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found in ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Prompts-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
