name: Build Daily Prompts APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract selected source ZIP
        run: |
          set -euo pipefail
          ZIP="daily-prompts (2).zip"
          test -f "$ZIP" || {
            echo "ERROR: ZIP not found: $ZIP"
            exit 1
          }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT" || {
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Prompts-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
