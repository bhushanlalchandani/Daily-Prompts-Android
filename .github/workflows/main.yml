name: Build Daily Prompts APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          FOUND=false

          for ZIP in *.zip; do
            [ -f "$ZIP" ] || continue

            echo "Checking ZIP: $ZIP"

            rm -rf extracted/*
            unzip -q "$ZIP" -d extracted || continue

            PROJECT_SETTINGS=$(find extracted -name settings.gradle.kts -type f -print -quit)

            if [ -n "$PROJECT_SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

              if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
                echo "Selected source ZIP: $ZIP"
                echo "Project directory: $PROJECT_DIR"
                echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
                FOUND=true
                break
              fi
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No ZIP containing a valid Android project was found."
            exit 1
          fi

      - name: Create debug keystore if missing
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$PROJECT_DIR/app/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Prompts-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
