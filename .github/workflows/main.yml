name: Build Daily Prompts APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract merged project ZIP
        run: |
          set -euo pipefail
          ZIP="daily-prompts-claude-and-chatgpt-gemini-merged.zip"
          test -f "$ZIP" || {
            echo "ERROR: Required ZIP not found: $ZIP"
            exit 1
          }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT="extracted/daily-prompts-src"
          test -f "$PROJECT/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Prompts-debug-APK
          path: extracted/daily-prompts-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
