name: Build Daily Prompts APK

on:
  workflow_dispatch:
  push:
    paths:
      - "daily-prompts-modern-ui-source.zip"
      - "daily-prompts-modern-ui-source-daily-fix.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f daily-prompts-modern-ui-source-daily-fix.zip ]; then
            ZIP_FILE="daily-prompts-modern-ui-source-daily-fix.zip"
          else
            ZIP_FILE="daily-prompts-modern-ui-source.zip"
          fi
          echo "Building from $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/daily-prompts-src/settings.gradle.kts

      - name: Build debug APK
        run: |
          gradle -p extracted/daily-prompts-src assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Prompts-debug-APK
          path: extracted/daily-prompts-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
